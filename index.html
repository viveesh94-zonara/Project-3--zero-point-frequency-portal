<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project 3Ɛ - Absolute Universal Execution Portal</title>
    <style>
        /* Base Styling - Premium HD Pitch Black Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Top Header Plane */
        header {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }
        h1 {
            font-size: 2.6rem;
            letter-spacing: 5px;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
            font-weight: 300;
        }
        .initiator {
            font-size: 0.95rem;
            color: #888888;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Nav Interface Facilities Tabs */
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            z-index: 30;
        }
        .tab-btn {
            background: #111;
            border: 1px solid #333;
            color: #aaa;
            padding: 10px 18px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn:hover, .tab-btn.active {
            color: #f1c40f;
            border-color: #f1c40f;
            background: #0a0a0a;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.25);
        }

        /* Your Exact Original Unified Logo Design Layout Container */
        .portal-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            height: 280px;
            margin: 20px 0;
            position: relative;
        }
        .logo-emblem {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            position: relative;
            z-index: 5;
        }
        .wing-33 {
            font-size: 6.5rem;
            font-weight: bold;
            color: #f39c12;
            text-shadow: 0 0 25px rgba(243, 156, 18, 0.6);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .wing-33:hover {
            transform: scale(1.08);
        }
        .wing-ee {
            font-size: 6.5rem;
            font-weight: bold;
            color: #e74c3c;
            text-shadow: 0 0 25px rgba(231, 76, 60, 0.6);
            cursor: pointer;
            transition: transform 0.3s ease;
            transform: scaleX(-1); /* Perfect mirror layout mapping */
        }
        .wing-ee:hover {
            transform: scaleX(-1) scale(1.08);
        }
        .center-void-vortex {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #000000 35%, #1a0033 65%, #4a00e0 100%);
            box-shadow: 0 0 30px #4a00e0, inset 0 0 20px #000000;
            cursor: pointer;
            animation: spin 8s linear infinite;
            transition: all 0.4s ease;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .center-void-vortex.active {
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 50px #fff, 0 0 80px #4a00e0;
            transform: scale(1.15);
        }

        /* Intake Operational Panel UI Screen */
        .intake-panel {
            position: absolute;
            bottom: -60px;
            width: 100%;
            background: rgba(12, 12, 12, 0.99);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 22px;
            z-index: 50;
            box-shadow: 0 15px 50px rgba(0,0,0,0.95);
            display: none;
        }
        .intake-panel.open {
            display: block;
        }
        .panel-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        select, input[type="text"] {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            padding: 10px;
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        select:focus, input[type="text"]:focus {
            border-color: #f1c40f;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Full Overlay Layer Display System */
        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: none;
            z-index: 100;
            padding: 25px;
        }
        .library-layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 20px;
        }
        .spine-column {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            overflow-y: auto;
            width: 260px;
            padding-right: 12px;
            border-right: 1px solid #222;
        }
        .vertebra-node {
            width: 100%;
            min-height: 28px;
            margin: 3px 0;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 0.78rem;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .vertebra-node:hover, .vertebra-node.active-gold {
            background: #f1c40f;
            border-color: #f1c40f;
            color: #000;
            font-weight: bold;
        }
        .content-display-panel {
            flex: 1;
            padding: 25px;
            background: #050505;
            border: 1px solid #222;
            border-radius: 12px;
            overflow-y: auto;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
        }
        .content-display-panel h2 {
            font-size: 1.6rem;
            color: #f1c40f;
            margin-bottom: 15px;
            font-weight: 300;
            border-bottom: 1px solid #222;
            padding-bottom: 6px;
        }
        .flow-container { display: flex; flex-direction: column; width: 100%; }
        .flow-node { background: #0d0d0d; border: 1px solid #222; padding: 14px; border-radius: 8px; margin: 6px 0; font-size: 0.9rem; border-left: 5px solid #f1c40f; line-height: 1.4; }
        .flow-node strong { color: #f1c40f; font-weight: 400; }
        .flow-node p { color: #aaa; font-size: 0.8rem; margin-top: 3px; }
        .flow-arrow { text-align: center; color: #333; font-size: 1.2rem; }
        .facility-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 10px; }
        .facility-card { background: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 18px; line-height: 1.5; }
        .facility-card h3 { color: #f1c40f; font-size: 1.05rem; margin-bottom: 8px; }
        .facility-card p { color: #bba; font-size: 0.85rem; }
        .close-overlay-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
            z-index: 110;
        }

        footer { font-size: 0.65rem; color: #444444; text-align: center; max-width: 900px; line-height: 1.5; margin-top: 15px; border-top: 1px solid #111; padding-top: 10px; }
    </style>
</head>
